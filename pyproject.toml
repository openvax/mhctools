[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhctools"
dynamic = ["version"]
description = "Python interface to MHC binding, presentation, immunogenicity, and antigen processing predictors"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
  { name = "Alex Rubinsteyn", email = "alex@openvax.org" },
  { name = "Julia Kodysh", email = "julia@openvax.org" },
  { name = "Tim O'Donnell", email = "tim@openvax.org" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=2.0.0,<3.0.0",
  "pandas>=0.13.1",
  "varcode>=0.5.9",
  "pyensembl>=2.3.0,<3.0.0",
  "sercol>=0.0.2",
  "mhcflurry>=2.0.0",
  "mhcgnomes>=3.4.0",
  "platformdirs>=3.0.0",
]

[project.optional-dependencies]
pepsickle = [
  "pepsickle",
]
mixmhcpred = [
  # Runtime packages used by the separately licensed upstream v3 checkout.
  "scipy",
  "logomaker",
  "matplotlib",
]
nettcr = [
  # A TFLite runtime for NetTCR's bundled models. ai-edge-litert is the
  # lightweight option; tensorflow also works. Fetch the tested pan weights
  # with `mhctools fetch nettcr --accept-license`.
  "ai-edge-litert",
]
caphla = [
  "torch>=1.12",
]
dev = [
  "build",
  # Ruff 0.16 changed its default rule set; keep lint reproducible until #268.
  "ruff==0.15.21",
  "pytest",
  "pytest-cov",
  "twine",
  "wheel",
]

[project.scripts]
mhctools = "mhctools.cli.script:main"

[project.urls]
Homepage = "https://github.com/openvax/mhctools"

[tool.setuptools.dynamic]
version = { attr = "mhctools.__version__" }

[tool.setuptools]
packages = ["mhctools", "mhctools.cli"]

[tool.setuptools.package-data]
"mhctools" = ["logging.conf"]
"mhctools.cli" = ["logging.conf"]
