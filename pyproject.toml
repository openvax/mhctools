[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhctools"
dynamic = ["version"]
description = "Python interface to MHC binding, presentation, immunogenicity, and antigen processing predictors"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
  { name = "Alex Rubinsteyn", email = "alex@openvax.org" },
  { name = "Julia Kodysh", email = "julia@openvax.org" },
  { name = "Tim O'Donnell", email = "tim@openvax.org" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26.0,<2.0.0; python_version < '3.10'",
  "numpy>=2.0.0,<3.0.0; python_version >= '3.10'",
  "pandas>=0.13.1",
  "varcode>=0.5.9",
  "pyensembl>=2.3.0,<3.0.0",
  "sercol>=0.0.2",
  "mhcflurry>=2.0.0",
  "mhcgnomes>=3.4.0",
  "platformdirs>=3.0.0",
]

[project.optional-dependencies]
pepsickle = [
  "pepsickle",
]
mixmhcpred = [
  # Runtime packages used by the separately licensed upstream v3 checkout.
  # Upstream uses read_csv(delim_whitespace=...), removed in pandas 3.
  "pandas<3",
  "scipy",
  "logomaker",
  "matplotlib",
]
nettcr = [
  # A TFLite runtime for NetTCR's bundled models. ai-edge-litert is the
  # lightweight option; tensorflow also works. Fetch the tested pan weights
  # with `mhctools fetch nettcr --accept-license`.
  "ai-edge-litert",
]
caphla = [
  "torch>=1.12",
]
mixtcrpred = [
  # Runtime for the separately licensed upstream checkout. MixTCRpred's
  # checkpoints were created with Lightning 1.6 but are exercised in CI on a
  # current PyTorch/Lightning CPU stack.
  "torch>=1.12",
  "torchvision",
  "pytorch-lightning>=1.6",
  "scipy",
  "scikit-learn",
]
vaccine-report = [
  "matplotlib",
]
dev = [
  "build",
  # [tool.ruff.lint] declares the rule set, so a newer ruff no longer changes
  # which rules run. Cap the minor anyway: a release can still add codes under
  # a selected prefix or change an existing check, and lint gates the hook.
  "ruff>=0.15.21,<0.17",
  "pytest",
  "pytest-cov",
  "twine",
  "wheel",
]

[project.scripts]
mhctools = "mhctools.cli.script:main"

[project.urls]
Homepage = "https://github.com/openvax/mhctools"

[tool.setuptools.dynamic]
version = { attr = "mhctools.__version__" }

[tool.setuptools]
packages = ["mhctools", "mhctools.cli", "mhctools.data"]

[tool.setuptools.package-data]
"mhctools" = ["logging.conf"]
"mhctools.cli" = ["logging.conf"]
"mhctools.data" = ["*.json"]

[tool.ruff]
# Ruff's default rule selection changes between releases: 0.16 enabled a much
# larger set than 0.15, which turned ~900 pre-existing findings into lint
# failures on an unmodified tree and blocked commits (#268, #450). Declaring
# the selection explicitly makes `./lint.sh` depend on this file rather than on
# whichever ruff happens to be installed.
target-version = "py39"

[tool.ruff.lint]
# E4/E7/E9 + F — ruff's default selection as of 0.15.x, pinned here verbatim so
# that adopting further rules stays a deliberate, reviewable change.
select = ["E4", "E7", "E9", "F"]
