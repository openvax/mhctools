{# Render package metadata at build time; GitHub release tags can be obsolete. #}
<a href="{{ config.repo_url }}" title="{{ lang.t('source') }}" class="md-source">
  <div class="md-source__icon md-icon">
    {% set icon = config.theme.icon.repo or "fontawesome/brands/git-alt" %}
    {% include ".icons/" ~ icon ~ ".svg" %}
  </div>
  <div class="md-source__repository md-source__repository--active">
    {{ config.repo_name }}
    <ul class="md-source__facts">
      <li class="md-source__fact md-source__fact--version">v{{ config.extra.package_version }}</li>
    </ul>
  </div>
</a>
