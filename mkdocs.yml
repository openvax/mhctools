site_name: mhctools
site_description: Run MHC binding, presentation, immunogenicity and antigen-processing predictors through one predict() call
site_url: https://openvax.github.io/mhctools/
repo_url: https://github.com/openvax/mhctools
repo_name: openvax/mhctools
edit_uri: edit/master/docs/
docs_dir: docs
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  palette:
    primary: white
    accent: blue
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.code.copy

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

hooks:
  - scripts/docs_version.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true
            heading_level: 3
            show_root_full_path: false
            separate_signature: true
            docstring_section_style: list
            show_source: false
            members_order: source

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      toc_depth: 2

extra_css:
  - stylesheets/docs.css

nav:
  - Home: index.md
  - Getting started:
      - First prediction: getting-started.md
      - Choosing a predictor: choosing.md
      - Getting models: artifacts.md
      - Optional backends: backends.md
      - Troubleshooting: troubleshooting.md
  - User guide:
      - Supported predictors: predictors/index.md
      - MHC binding and presentation: predictors/binding.md
      - Antigen processing:
          - Overview and predictors: predictors/processing.md
          - Choosing processing models: cleavage/choosing.md
          - Peptidase activity: cleavage/index.md
          - Peptidase models: cleavage/models.md
          - CleaveNet MMP substrates: cleavage/cleavenet.md
          - ITCell cathepsin profiles: cleavage/itcell.md
          - Reading the evidence: cleavage/evidence.md
          - Batch assessments: cleavage/batch.md
          - Validation status: cleavage/validation.md
          - Additional candidates: cleavage/candidates.md
          - PhageScout sequence profiles: cleavage/phagescout.md
      - Immunogenicity: predictors/immunogenicity.md
      - TCR specificity: predictors/tcr.md
      - Peptide half-life: predictors/peptide-pk.md
      - Target-preserving degradation: target-degradation.md
      - Serum peptidase contributions: serum-contributions.md
      - Human serum calibration evidence: serum-calibration.md
      - Vaccine target summary: vaccine-target-summary.md
      - SLP/mRNA pMHC trajectories: vaccine-trajectory.md
      - Cell penetration classification: predictors/uptake.md
      - Results and DataFrames: results.md
      - Recipes: recipes.md
      - Allele names: alleles.md
      - Command line: cli.md
      - Vaccine reports: vaccine-reports.md
      - Benchmarks: benchmarks.md
  - Reference:
      - API reference: api.md
      - Predictor matrix: predictor-matrix.md
      - Prediction kinds: kinds.md
      - Peptide PK and exposure: exposure-results.md
      - Environment variables: env-vars.md
      - Licensing: licensing.md
      - Known limits: limitations.md
      - Backend conformance: optional-backends.md
      - Migration guide: migration.md
      - Known gaps: known-gaps.md
  - Development:
      - Testing: testing.md
      - Documentation style: dev/documentation-style.md
      - Maintaining the SMM subset: dev/smm-subset.md
